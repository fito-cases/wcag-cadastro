<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Cadastro</h1>
    <p class="aviso">Página de demonstração: a confirmação acontece só nesta página, e nenhum dado é enviado a um servidor.</p>

    <div id="erros" class="resumo-erros" hidden></div>

    <form id="cadastro" novalidate>
      <p class="dica">Todos os campos são obrigatórios.</p>

      <div class="campo">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" autocomplete="name" required>
      </div>

      <div class="campo">
        <label for="codigo">CEP (código postal)</label>
        <p id="codigo-dica" class="dica">8 dígitos, só números, sem hífen. Exemplo: 20040020</p>
        <input id="codigo" name="codigo" type="text" inputmode="numeric" autocomplete="postal-code" required aria-describedby="codigo-dica">
      </div>

      <button type="submit">Enviar cadastro</button>
    </form>

    <p id="confirmacao" class="confirmacao" role="status" hidden></p>
  </main>
</body>
</html>
