<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Cadastro</h1>
    <p class="aviso">Página de demonstração: a confirmação acontece só nesta página, e nenhum dado é enviado a um servidor.</p>

    <div id="erros" class="resumo-erros" tabindex="-1" hidden></div>

    <form id="cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome (obrigatório)</label>
        <input id="nome" name="nome" type="text" autocomplete="name">
        <p id="erro-nome" class="erro" hidden></p>
      </div>

      <div class="campo">
        <label for="codigo">Código postal (8 dígitos)</label>
        <p id="dica-codigo" class="dica">Somente números, por exemplo 20040020.</p>
        <input id="codigo" name="codigo" type="text" inputmode="numeric" autocomplete="postal-code" aria-describedby="dica-codigo">
        <p id="erro-codigo" class="erro" hidden></p>
      </div>

      <button type="submit">Enviar</button>
    </form>

    <p id="confirmacao" class="confirmacao" role="status" hidden></p>
  </main>
</body>
</html>
