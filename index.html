<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Cadastro</h1>
    <p class="aviso">Página de demonstração: a confirmação acontece só nesta página, e nenhum dado é enviado a um servidor.</p>

    <div id="erros" class="resumo-erros" hidden></div>

    <form id="cadastro" novalidate>
      <div class="campo">
        <span>Nome</span>
        <input id="nome" name="nome" type="text" autocomplete="name">
      </div>

      <div class="campo">
        <input id="codigo" name="codigo" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="Código postal (8 dígitos)">
      </div>

      <button type="submit">Enviar</button>
    </form>

    <p id="confirmacao" class="confirmacao" role="status" hidden></p>
  </main>
</body>
</html>
