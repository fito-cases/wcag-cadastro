<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Cadastro</h1>
    <p class="aviso">Página de demonstração: a confirmação acontece só nesta página, e nenhum dado é enviado a um servidor.</p>

    <div id="erros" class="resumo-erros" role="region" aria-labelledby="titulo-erros" tabindex="-1" hidden>
      <h2 id="titulo-erros">Não foi possível concluir o cadastro. Corrija os campos abaixo:</h2>
      <ul id="lista-erros"></ul>
    </div>

    <form id="cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome (obrigatório)</label>
        <input id="nome" name="nome" type="text" autocomplete="name" required aria-describedby="nome-erro">
        <p id="nome-erro" class="erro" hidden></p>
      </div>

      <div class="campo">
        <label for="codigo">Código postal (obrigatório)</label>
        <p id="codigo-dica" class="dica">Digite 8 dígitos, sem espaços ou hífen. Exemplo: 20040020.</p>
        <input id="codigo" name="codigo" type="text" inputmode="numeric" autocomplete="postal-code" required aria-describedby="codigo-dica codigo-erro">
        <p id="codigo-erro" class="erro" hidden></p>
      </div>

      <button type="submit">Enviar</button>
    </form>

    <p id="confirmacao" class="confirmacao" role="status" hidden></p>
  </main>
</body>
</html>
